# The form for a bug. Written 2026-11-09 by Melanikus for AVPx Dedicated Server.
name: A bug
description: Something the server does that it shouldn't, or doesn't do that it should. Not for security problems (SECURITY.md).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **A security problem?** Don't write it here: report it privately (Security, then "Report a vulnerability"), as SECURITY.md says.
        Please put no IP address, pass key, owner key or other secret in this form: it's public.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to make it happen
      description: The smallest steps you can, from a fresh start.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: The commit you ran
      description: 40 hex digits (git rev-parse HEAD).
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: What the server's log said
      description: Its lines are counts and times, never an address; check before pasting.
      render: text
