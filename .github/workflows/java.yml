# The Java server's checks (java/): its tests, the same jar from the same code, and CodeQL. Written 2026-11-08 by Melanikus for AVPx
# Dedicated Server.
#
# Every check here fails the change if it fails (GATES.md). Every action is pinned to a full commit hash, with its version in a comment
# (CODING-STANDARD.md rule 7), and the JDK is fetched and checked by java/tools/get-jdk.sh, never by an action.
name: Java

on:
  pull_request:
  push:
    branches: [main, java]
  # So a run can be started again by hand, by someone with write access to the repository
  workflow_dispatch:

# Nothing here may write to the repository. CodeQL alone may write its findings, in its own job.
permissions:
  contents: read

jobs:
  tests:
    name: Java tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # get-jdk.sh must use nothing from the user's home: the deploy runs it as a user with none (avpx-build, ProtectHome). So here it runs
      # with a home whose .curlrc sends every download to a proxy that isn't there, and whose gpg.conf has an option gpg refuses: if it
      # read either, it would fail. First, the trap is shown to trap: plain curl and plain gpg, which do read the home, fail in it.
      - name: The pinned JDK, checked by its signature, its sha256 and its version before it runs, using nothing from the home folder
        run: |
          trapped="$RUNNER_TEMP/trapped-home"
          mkdir -p "$trapped/.gnupg"
          chmod 700 "$trapped/.gnupg"
          printf 'proxy = "http://127.0.0.1:9"\n' > "$trapped/.curlrc"
          printf 'no-such-gpg-option\n' > "$trapped/.gnupg/gpg.conf"
          if HOME="$trapped" curl --silent --max-time 20 --output /dev/null https://github.com; then echo "the .curlrc trap doesn't trap"; exit 1; fi
          if HOME="$trapped" gpg --batch --list-keys > /dev/null 2>&1; then echo "the gpg.conf trap doesn't trap"; exit 1; fi
          HOME="$trapped" sh java/tools/get-jdk.sh "$RUNNER_TEMP/jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> "$GITHUB_ENV"

      # The live tests open sockets on 127.0.0.1 only, and must all run here: with AVPX_LIVE=1 a live test that doesn't run fails
      - name: Build, and run every test, the live ones too
        env:
          AVPX_LIVE: '1'
        run: sh java/build.sh

      # The deploy builds the jars again on the server's machine and needs the very same bytes, so this builds a copy in another folder on
      # another filesystem (/dev/shm, held in memory, which lists folders in another order than the runner's disk) and compares
      - name: The same code makes the same jars, byte for byte, on another filesystem too
        run: |
          first=$(cd java/build && sha256sum avpx-server.jar avpx-smoke.jar)
          copy=/dev/shm/avpx-same-jars
          rm -rf "$copy"
          mkdir -p "$copy"
          cp -R java test-vectors deploy "$copy/"
          rm -rf "$copy/java/build"
          sh "$copy/java/build.sh" > /dev/null
          second=$(cd "$copy/java/build" && sha256sum avpx-server.jar avpx-smoke.jar)
          echo "built here:"
          echo "$first"
          echo "built again on /dev/shm:"
          echo "$second"
          test "$first" = "$second"

      # CODING-STANDARD.md's rules, the Java side (tools/check-standard.js keeps the Node side): run from the repository's top folder
      - name: The Java standard
        run: '"$JAVA_HOME/bin/java" -cp java/build/tools avpx.tools.CheckStandard'

  # The pinned JDK is the one thing from outside the Java version uses, so it must be the newest of its line: when Adoptium has a newer
  # Temurin 25, this fails until get-jdk.sh's pin moves to it (GATES.md)
  jdk-current:
    name: The JDK is the newest Temurin 25
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pin against Adoptium's newest GA release
        run: |
          pinned="jdk-$(sed -n "s/^JDK_RELEASE='\(.*\)'$/\1/p" java/tools/get-jdk.sh)"
          newest=$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            'https://api.adoptium.net/v3/assets/latest/25/hotspot?architecture=x64&image_type=jdk&os=linux&vendor=eclipse' \
            | jq -r '.[0].release_name')
          echo "pinned $pinned, Adoptium's newest $newest"
          test "$pinned" = "$newest"

  # The smoke test (java/tools/Smoke.java, 38 checks from outside the process) against the running Java server, and against the Node
  # server too while it's still here, with the same certificate, settings and expected results: proof the two speak the same wire
  smoke:
    name: Smoke test, 38 checks, against each server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned JDK, checked as above
        run: |
          sh java/tools/get-jdk.sh "$RUNNER_TEMP/jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> "$GITHUB_ENV"

      - uses: ./.github/actions/node

      - name: Build
        run: sh java/build.sh

      # One certificate for localhost and 127.0.0.1, made for this run and thrown away with it (the key in PKCS#8 form, OpenSSL 3's
      # own), and the settings both servers read: the list on 8443 and the relay on 127.0.0.1 only, as Smoke.java expects
      - name: A throwaway certificate, and the settings
        run: |
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" -keyout "$dir/privkey.pem" -out "$dir/list-test.pem" 2> /dev/null
          key=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')
          cat > "$dir/settings.json" <<EOF
          {
            "region": "virginia",
            "passKey": "$key",
            "relayAddress": "127.0.0.1",
            "controlPort": 27500,
            "relayPorts": "27501-27564",
            "logFile": "$dir/server.log",
            "list": {
              "address": "127.0.0.1",
              "port": 8443,
              "certFile": "$dir/list-test.pem",
              "keyFile": "$dir/privkey.pem",
              "relays": [{ "region": "virginia", "host": "localhost", "port": 27500 }]
            }
          }
          EOF
          # The Java server reads its settings from /etc/avpx/settings.json and nowhere else
          sudo install -d -m 0755 /etc/avpx
          sudo install -m 0644 "$dir/settings.json" /etc/avpx/settings.json

      - name: The Java server, and the 38 checks against it
        run: |
          cd "$RUNNER_TEMP/smoke"
          rm -f server.log
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/java/build/avpx-server.jar" > java-server.out 2>&1 &
          server=$!
          status=0
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/java/build/avpx-smoke.jar" || status=$?
          kill "$server"
          wait "$server" || true
          echo "----- what the Java server wrote to its screen"
          cat java-server.out
          exit "$status"

      - name: The Node server, and the same 38 checks against it (while the Node version is still here)
        run: |
          cd "$RUNNER_TEMP/smoke"
          rm -f server.log
          node "$GITHUB_WORKSPACE/main.js" /etc/avpx/settings.json > node-server.out 2>&1 &
          server=$!
          status=0
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/java/build/avpx-smoke.jar" || status=$?
          kill "$server"
          wait "$server" || true
          echo "----- what the Node server wrote to its screen"
          cat node-server.out
          exit "$status"

      # A relay-only machine (a later region's: its settings have no list) gets the relay's checks only, through --installed as the deploy's
      # health check runs it. The run must pass every check that ran, and must say the list's didn't, so it never reads as a full pass.
      - name: A relay-only Java server, and Smoke --installed against it
        run: |
          dir="$RUNNER_TEMP/smoke-relay-only"
          mkdir -p "$dir"
          key=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')
          printf '{ "region": "saopaulo", "passKey": "%s", "relayAddress": "127.0.0.1", "controlPort": 27500, "relayPorts": "27501-27564" }\n' \
            "$key" > "$dir/settings.json"
          sudo install -m 0644 "$dir/settings.json" /etc/avpx/settings.json
          cd "$dir"
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/java/build/avpx-server.jar" > server.out 2>&1 &
          server=$!
          status=0
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/java/build/avpx-smoke.jar" --installed > smoke.out 2>&1 || status=$?
          kill "$server"
          wait "$server" || true
          cat smoke.out
          echo "----- what the relay-only server wrote to its screen"
          cat server.out
          grep -q '^NOT RUN  the list' smoke.out || { echo "the relay-only run didn't say the list's checks were left out"; exit 1; }
          exit "$status"

      # A version 2 relay ("protocol": 2; relay-only, as version 2's list isn't built yet), its static keys made fresh by MakeRelayKeys, and
      # Smoke --installed against it as the deploy will run it: SmokeV2's pin to crypto-v2.json first, then a whole game, sealed
      - name: A version 2 Java relay, and Smoke --installed against it (the pin first)
        run: |
          dir="$RUNNER_TEMP/smoke-v2"
          mkdir -p "$dir"
          key=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')
          keys=$("$JAVA_HOME/bin/java" -cp "$GITHUB_WORKSPACE/java/build/tools:$GITHUB_WORKSPACE/java/build/server" avpx.tools.MakeRelayKeys \
            | sed -n '/^"staticKeys": {$/,/^}$/p')
          printf '{ "region": "saopaulo", "passKey": "%s", "relayAddress": "127.0.0.1", "controlPort": 27500, "relayPorts": "27501-27564",\n  "protocol": 2,\n%s\n}\n' \
            "$key" "$keys" > "$dir/settings.json"
          sudo install -m 0644 "$dir/settings.json" /etc/avpx/settings.json
          cd "$dir"
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/java/build/avpx-server.jar" > server.out 2>&1 &
          server=$!
          status=0
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/java/build/avpx-smoke.jar" --installed > smoke.out 2>&1 || status=$?
          kill "$server"
          wait "$server" || true
          cat smoke.out
          echo "----- what the version 2 server wrote to its screen"
          cat server.out
          grep -q '^PASS  the pin' smoke.out || { echo "the version 2 run didn't pass its pin to crypto-v2.json"; exit 1; }
          grep -q '^NOT RUN  the list' smoke.out || { echo "the version 2 run didn't say the list's checks were left out"; exit 1; }
          exit "$status"

  takeouts:
    name: Java take-outs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned JDK, checked as above
        run: |
          sh java/tools/get-jdk.sh "$RUNNER_TEMP/jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> "$GITHUB_ENV"

      # Each row of java/tools/takeouts.txt breaks one thing in a copy, and its check must fail: proof the checks can fail
      - name: Every take-out row is noticed
        run: |
          sh java/build.sh
          "$JAVA_HOME/bin/java" -cp java/build/tools avpx.tools.Takeouts

  codeql:
    name: CodeQL (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The pinned JDK, checked as above
        run: |
          sh java/tools/get-jdk.sh "$RUNNER_TEMP/jdk"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk" >> "$GITHUB_ENV"

      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # CodeQL reads the code as javac compiles it: build.sh compiles every .java file in java/, the server's and the tests'
      - name: Build, so CodeQL sees every file compiled
        run: sh java/build.sh

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: java
          output: ${{ runner.temp }}/codeql

      # Any finding at any severity fails the check (GATES.md): the results are counted from CodeQL's own file, not from its summary.
      # Each one is written out too (its rule, its file and line, its words, and for a finding about data, where that data came from), so
      # this log alone says what to fix.
      - name: No findings at all
        run: |
          found=$(jq '[.runs[].results[]] | length' "$RUNNER_TEMP"/codeql/*.sarif)
          echo "CodeQL found $found"
          jq -r '.runs[].results[]
            | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.message.text)",
              (.codeFlows[]?.threadFlows[]?.locations[0].location.physicalLocation
                | "    its data comes from \(.artifactLocation.uri):\(.region.startLine)")' "$RUNNER_TEMP"/codeql/*.sarif
          test "$found" = "0"

      # A blind spot fails the gate too: every .java file in java/ must be in what CodeQL read
      - name: CodeQL read every Java file
        run: |
          tracked=$(git ls-files 'java/*.java' | wc -l)
          echo "$tracked Java files are tracked"
          test "$tracked" -gt 0
          for f in $(git ls-files 'java/*.java'); do
            jq -e --arg f "$f" '[.runs[].artifacts[]?.location.uri] | any(. == $f)' "$RUNNER_TEMP"/codeql/*.sarif > /dev/null \
              || jq -e --arg f "$f" '[.runs[].invocations[]?.toolExecutionNotifications[]?.locations[]?.physicalLocation.artifactLocation.uri] | any(. == $f)' "$RUNNER_TEMP"/codeql/*.sarif > /dev/null \
              || { echo "CodeQL didn't read $f"; exit 1; }
          done
