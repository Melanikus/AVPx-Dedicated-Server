# Server blockers: proves deploy/check-blockers.sh refuses a deploy while SERVER-BLOCKERS.md lists anything, and shows what's listed.
# Written 2026-11-09 by Melanikus for AVPx Dedicated Server.
#
# This check doesn't fail because something is listed: that's the deploy's own first step (sh deploy/check-blockers.sh, with no --list).
# It fails if the refusal itself doesn't work (deploy/test-check-blockers.sh, which also breaks copies of the checker and must notice).
# Plain sh and awk: nothing is installed. The only action is checkout, pinned to a full commit hash (CODING-STANDARD.md rule 7).
name: Server blockers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blockers:
    name: Server blockers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The refusal works
        run: sh deploy/test-check-blockers.sh
      - name: What blocks a deploy now
        run: sh deploy/check-blockers.sh --list

  # deploy/remote-deploy.sh, the script the SSM document runs on the machine, tested with stand-ins for curl, systemctl and java: no
  # machine, no network, no AWS. It moves a symbolic link, which needs Linux, so this is where its whole test runs.
  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: remote-deploy.sh, every case and its take-outs
        run: sh deploy/test-remote-deploy.sh
      - name: The SSM document is what remote-deploy.sh makes
        run: sh deploy/make-ssm-document.sh --check
      - name: deploy.yml keeps its shape (by hand only, dry run by default, blockers first, the token in one job, every check required)
        run: sh deploy/test-deploy-workflow.sh
      - name: open-for-tester.sh and close-for-tester.sh (one address, the server's ports only), with a stand-in ufw
        run: sh deploy/test-open-for-tester.sh
      - name: firewall.sh (the list machine, and a relay-only one), with a stand-in ufw
        run: sh deploy/test-firewall.sh
      - name: get-aws-cli.sh (the pinned AWS CLI, its signature, sha256 and version), against a made-up release signed with a test key
        run: sh deploy/test-get-aws-cli.sh
      - name: The curl, jq, gpg, unzip and sha256sum the deploy uses are Ubuntu's own on this runner, unchanged
        run: sh deploy/check-ubuntu-tools.sh
