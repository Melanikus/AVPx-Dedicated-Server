# The deploy: records one commit of the Java server, approved by the owner, for the machine to fetch and put in place itself (the pull
# route). Nothing here reaches the machine, and no key or token is kept anywhere. Written 2026-11-09 by Melanikus for AVPx Dedicated
# Server; the pull route the same night, by the owner's ruling ("nyc3 pulls its deploys"), in place of the AWS Systems Manager route.
#
# It's started by hand only (Actions, "Deploy", Run workflow), with the commit to deploy and the machine it's for. Each job needs the one
# before, and the first that fails stops it all:
#   1. Server blockers: refuses unless it was started from main, so the list it reads is main's as it is then; and refuses while that
#      SERVER-BLOCKERS.md lists anything (sh deploy/check-blockers.sh). So today it always refuses.
#   2. Gates: the commit is on main, and the latest run of every workflow named in REQUIRED, for a push of that very commit to main,
#      ended in success. Runs are matched by their workflow's file, never by a check's name, so nothing else (another app's check, or
#      this workflow's own jobs, all named "Deploy: ...") can stand in for one.
#   3. Build: the two jars built from that commit with the pinned JDK (the server and its smoke test), and one SHA-256 of both. The
#      machine builds them again from the same source and puts them in place only if they're byte for byte the same
#      (deploy/remote-deploy.sh).
#   4. Record: waits for the owner to approve the "production" environment. Then, with the one right to write deployments, it records a
#      GitHub deployment for environment avpx-<machine>: the commit, the jars' SHA-256, and this run's number. The machine's own timer
#      (deploy/pull-deploy.sh, every 5 minutes) finds it, checks this run was deploy.yml, by hand, from main, finished with success in
#      its first attempt, named for this commit and machine, and approved by the owner, checks main's SERVER-BLOCKERS.md itself, and only
#      then deploys. So the run must end with success for the machine to take it: this job is the last.
#   A dry run (the default) does all of that but the recording, and says what it would have recorded.
#
# THE RUN'S NAME (run-name, below) is "Deploy <commit> to <machine>", with " (dry run)" after it for a dry run. The machine requires it
# to be exactly "Deploy <the deployment's commit> to <itself>", so an approval only ever counts for the commit and machine the owner
# started that run for, and a dry run's never does, whoever wrote the deployment.
#
# No action but checkout is used, and no secret. This job's own token (GitHub's GITHUB_TOKEN, which ends with the run) is the one thing
# that writes, and only deployments.
#
# THE TOOLS: curl and jq are Ubuntu's own, always by their full path (/usr/bin/curl, /usr/bin/jq), so nothing earlier on PATH can stand
# in for one; each job that uses them first runs deploy/check-ubuntu-tools.sh, which checks they're Ubuntu's and unchanged. GitHub's own
# gh tool isn't used: its questions to GitHub are asked with curl.
name: Deploy
run-name: Deploy ${{ inputs.commit }} to ${{ inputs.machine }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'The commit to put on the machine: 40 hex digits, small letters, already on main'
        required: true
        type: string
      machine:
        description: 'The machine it is for: its region, 1 to 16 small letters, digits and -'
        required: true
        type: string
        default: nyc3
      dry_run:
        description: 'Do everything but record it, and say what would have been recorded'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# One deploy at a time, and a second waits rather than cutting the first off
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  COMMIT: ${{ inputs.commit }}
  MACHINE: ${{ inputs.machine }}
  # The workflows whose latest run for the commit must have succeeded, by file, all of them (GATES.md): every one but this file
  REQUIRED: 'java.yml blockers.yml snyk.yml proofs.yml'

jobs:
  blockers:
    name: 'Deploy: blockers'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Started from main only, so the checkout below is main as it is now, and the list it reads is main's
      - name: Started from main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "deploy.yml runs from main only, and this run was started from $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each value is held to its shape by case and by its length, never by grep: grep passes a text with a line break in it if any one
      # of its lines matches (Secondary's re-check, R-2)
      - name: The commit's and the machine's shapes
        run: |
          case "$COMMIT" in *[!0-9a-f]*) echo 'the commit must be 40 hex digits, small letters'; exit 1 ;; esac
          [ "${#COMMIT}" -eq 40 ] || { echo 'the commit must be 40 hex digits, small letters'; exit 1; }
          case "$MACHINE" in ''|*[!a-z0-9-]*) echo 'the machine is its region: 1 to 16 small letters, digits and -'; exit 1 ;; esac
          [ "${#MACHINE}" -le 16 ] || { echo 'the machine is its region: 1 to 16 small letters, digits and -'; exit 1; }
      - name: Nothing blocks a deploy
        run: sh deploy/check-blockers.sh

  gates:
    name: 'Deploy: gates'
    needs: blockers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: curl and jq are Ubuntu's own, unchanged
        run: sh deploy/check-ubuntu-tools.sh
      - name: The commit is on main, and the latest run of every required workflow for it succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Only Ubuntu's own folders, so every command here is Ubuntu's, whatever the runner put earlier on PATH
          PATH=/usr/bin:/bin
          # One question to GitHub's API, with this job's own token (which may only read): HTTPS only, and fail on any HTTP error.
          # -q first, so curl reads no ~/.curlrc.
          ask() {
            /usr/bin/curl -q --fail --silent --show-error --proto '=https' --tlsv1.2 -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"
          }
          ask "compare/$COMMIT...main" > compare.json
          where=$(/usr/bin/jq -r .status compare.json)
          case "$where" in ahead|identical) echo "the commit is on main" ;; *) echo "the commit isn't on main ($where)"; exit 1 ;; esac
          ask "actions/runs?head_sha=$COMMIT&event=push&branch=main&per_page=100" > runs.json
          missing=0
          for flow in $REQUIRED; do
            ended=$(/usr/bin/jq -r --arg path ".github/workflows/$flow" --arg sha "$COMMIT" \
              '[.workflow_runs[] | select(.path == $path and .head_sha == $sha)] | sort_by(.run_number, .run_attempt) | last | .conclusion // "no run"' runs.json)
            if [ "$ended" = success ]; then echo "succeeded: $flow"; else echo "NOT SUCCEEDED: $flow ($ended)"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo 'the commit has not passed every required workflow'; exit 1; }

  build:
    name: 'Deploy: build'
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      jars: ${{ steps.hash.outputs.jars }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: The pinned JDK, checked by its signature, its sha256 and its version
        run: sh java/tools/get-jdk.sh "$RUNNER_TEMP/jdk"
      - name: Build, with every test
        run: JAVA_HOME="$RUNNER_TEMP/jdk" sh java/build.sh
      # The SHA-256 of what sha256sum prints for both jars, in the build folder: deploy/remote-deploy.sh makes it the same way
      - name: The jars' SHA-256
        id: hash
        run: |
          jars=$( (cd java/build && sha256sum avpx-server.jar avpx-smoke.jar) | sha256sum | cut -d ' ' -f 1)
          echo "the jars for $COMMIT: $jars"
          echo "jars=$jars" >> "$GITHUB_OUTPUT"

  record:
    name: 'Deploy: record, for the machine to take'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      JARS: ${{ needs.build.outputs.jars }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: curl and jq are Ubuntu's own, unchanged
        run: sh deploy/check-ubuntu-tools.sh
      # By case and by length, as the blockers job holds the commit and the machine, never by grep
      - name: The jars' SHA-256 and the machine, each in its shape
        run: |
          case "$JARS" in *[!0-9a-f]*) echo "the build gave no SHA-256 for the jars"; exit 1 ;; esac
          [ "${#JARS}" -eq 64 ] || { echo "the build gave no SHA-256 for the jars"; exit 1; }
          case "$MACHINE" in ''|*[!a-z0-9-]*) echo 'the machine is its region: 1 to 16 small letters, digits and -'; exit 1 ;; esac
          [ "${#MACHINE}" -le 16 ] || { echo 'the machine is its region: 1 to 16 small letters, digits and -'; exit 1; }

      - name: A dry run says what it would record, and records nothing
        if: ${{ inputs.dry_run }}
        run: |
          echo "would record, for environment avpx-$MACHINE, a deployment of:"
          echo "  commit=$COMMIT"
          echo "  jarsSha256=$JARS"
          echo "  runId=$GITHUB_RUN_ID"

      - name: Record it, for the machine's timer to take
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Only Ubuntu's own folders, so every command here is Ubuntu's, whatever the runner put earlier on PATH
          PATH=/usr/bin:/bin
          # The deployment's body, made by jq so every value is written as JSON writes it. No check of GitHub's own (required_contexts
          # empty): the gates above are the checks, and the machine asks about this run itself.
          /usr/bin/jq -n --arg ref "$COMMIT" --arg environment "avpx-$MACHINE" --arg jars "$JARS" --argjson run "$GITHUB_RUN_ID" \
            '{ref: $ref, environment: $environment, auto_merge: false, required_contexts: [], production_environment: true,
              description: "AVPx Dedicated Server, approved by the owner", payload: {jarsSha256: $jars, runId: $run}}' > body.json
          /usr/bin/curl -q --fail --silent --show-error --proto '=https' --tlsv1.2 -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data @body.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/deployments" > made.json
          id=$(/usr/bin/jq -r '.id | tostring' made.json)
          sha=$(/usr/bin/jq -r .sha made.json)
          case "$id" in ''|0*|*[!0-9]*) echo 'GitHub made no deployment'; exit 1 ;; esac
          [ "$sha" = "$COMMIT" ] || { echo "GitHub's deployment is for another commit ($sha)"; exit 1; }
          echo "recorded deployment $id for avpx-$MACHINE: $COMMIT, jars $JARS, run $GITHUB_RUN_ID"
          echo "the machine's timer takes it within about 5 minutes of this run ending; its journal says what became of it"
