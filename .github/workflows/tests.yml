# The server's own checks, on every push to main and every pull request (GATES.md): Tests, Coding standard and Take-outs. Written
# 2026-11-08 by Melanikus for AVPx Dedicated Server.
#
# Every action is pinned to a full commit (CODING-STANDARD.md rule 7). Node comes from our own ./.github/actions/node, checked by its
# SHA-256. The live tests open sockets on 127.0.0.1 only (test/live.test.js), so here they always run, never skipped.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node
      - name: The tests, live ones too
        env:
          AVPX_LIVE: '1'
        run: |
          set -euo pipefail
          node --test --test-reporter=tap 2>&1 | tee test-output.txt
          # A run that found no tests, skipped any, or left any undone is not a pass
          grep -q '^# pass [1-9]' test-output.txt || { echo 'no tests passed'; exit 1; }
          for none in fail skipped todo cancelled; do
            grep -q "^# $none 0$" test-output.txt || { echo "the tests had some $none"; exit 1; }
          done

  standard:
    name: Coding standard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node
      - run: node tools/check-standard.js

  takeouts:
    name: Take-outs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node
      - run: node tools/takeouts.js --live
