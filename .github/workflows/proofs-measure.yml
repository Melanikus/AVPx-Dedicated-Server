# FOR MEASURING ONLY: runs on a push to the proofs-measure branch, which is never merged. Written 2026-11-09 by Melanikus for AVPx
# Dedicated Server.
#
# Round 4. Round 3 (run 42718931602; the logs are kept outside the repository) found:
# - pqik q1 with names: proved, in 2.5 minutes; pqik q2 with no bad tester (nobad): proved, in 5 minutes. So the bad tester is
#   pqik's cost, and he's the attacker the proof must keep: a player whose key we approved, turned hostile;
# - pqik q2 with names: stopped at 320 minutes, at 10 GB and climbing half a gigabyte an hour, with 97,188 rules still queued. Time,
#   not memory, is what it lacks, and GitHub stops every job at 6 hours, so no bigger runner can finish it;
# - pqxx: out of memory with every change, bounded in 6 minutes, so its cost isn't the replication but one of its key steps.
# So this round keeps the bad tester and tries what ProVerif itself checks: secrecy assumptions for every secret an honest side makes
# (secret). And it takes pqxx's six key steps out one at a time, to find its cost as round 3 found pqik's. pqik q3 with no bad tester
# is there only to say whether he's q3's cost too, never as a proof.
#
# ProVerif is fetched, checked and built exactly as proofs.yml does it, and the comments there say why each step is so.
name: Proofs, measured

on:
  push:
    branches: [proofs-measure]

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.model }} ${{ matrix.variant }} ${{ matrix.setting }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: pqik, variant: as-written, setting: q2+secret }
          - { model: pqik, variant: as-written, setting: q2+names+secret }
          - { model: pqik, variant: as-written, setting: q3+names+secret }
          - { model: pqik, variant: as-written, setting: q1+names+secret }
          - { model: pqik, variant: as-written, setting: names+secret }
          - { model: pqik, variant: as-written, setting: q3+nobad }
          - { model: pqxx, variant: as-written, setting: q3+secret }
          - { model: pqxx, variant: as-written, setting: q3+names+secret }
          - { model: pqxx, variant: as-written, setting: q1+names+secret }
          - { model: pqxx, variant: as-written, setting: q3+noee }
          - { model: pqxx, variant: as-written, setting: q3+nokem2 }
          - { model: pqxx, variant: as-written, setting: q3+noes }
          - { model: pqxx, variant: as-written, setting: q3+nokem3 }
          - { model: pqxx, variant: as-written, setting: q3+nose }
          - { model: pqxx, variant: as-written, setting: q3+nokem4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Usually seconds. A slow mirror took 19 minutes once, and 5 minutes twice: so two tries of 5 minutes each, then it says so
      - name: OCaml, from Ubuntu's signed archive (two tries, 5 minutes each)
        timeout-minutes: 12
        run: |
          for try in 1 2; do
            if timeout 300 sh -c 'sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ocaml-nox'; then break; fi
            echo "OCaml's install, try $try, didn't finish in 5 minutes"
            [ "$try" -lt 2 ] || { echo 'the mirror is too slow: this says nothing about the proofs'; exit 1; }
          done
          ocamlopt -version
      - name: ProVerif 2.05 from INRIA's source, checked by its pinned SHA-256, then built (10 minutes at most)
        timeout-minutes: 10
        env:
          URL: https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz
          KEY: 4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4
        run: |
          set -eu
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 300 -o "$RUNNER_TEMP/proverif.tar.gz" "$URL"
          echo "$KEY  $RUNNER_TEMP/proverif.tar.gz" | sha256sum --check --strict
          tar -tzf "$RUNNER_TEMP/proverif.tar.gz" > "$RUNNER_TEMP/proverif.list"
          if grep -v '^proverif2\.05/' "$RUNNER_TEMP/proverif.list" | grep -q .; then echo 'a path outside proverif2.05/'; exit 1; fi
          if grep -q '\.\.' "$RUNNER_TEMP/proverif.list"; then echo 'a path with ..'; exit 1; fi
          tar -xzf "$RUNNER_TEMP/proverif.tar.gz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/proverif2.05" && sh ./build -nointeract)
          [ -x "$RUNNER_TEMP/proverif2.05/proverif" ] || { echo 'the build made no proverif'; exit 1; }
          echo "$RUNNER_TEMP/proverif2.05" >> "$GITHUB_PATH"
      - name: The one variant, with ProVerif's output and memory
        env:
          MODEL: ${{ matrix.model }}
          VARIANT: ${{ matrix.variant }}
          SETTING: ${{ matrix.setting }}
        run: |
          if [ -n "$SETTING" ]; then sh proofs/measure.sh "$MODEL" "$VARIANT" "$SETTING"; else sh proofs/measure.sh "$MODEL" "$VARIANT"; fi
