# The deploy: puts one commit of the Java server on the one machine, through AWS Systems Manager, with no key stored anywhere. Written
# 2026-11-09 by Melanikus for AVPx Dedicated Server.
#
# It's started by hand only (Actions, "Deploy", Run workflow), with the commit to deploy. Each job needs the one before, and the first
# that fails stops it all:
#   1. Server blockers: refuses while SERVER-BLOCKERS.md lists anything (sh deploy/check-blockers.sh). So today it always refuses.
#   2. Gates: the commit is on main, and the latest run of every workflow named in REQUIRED, for a push of that very commit to main,
#      ended in success. Runs are matched by their workflow's file, never by a check's name, so nothing else (another app's check, or
#      this workflow's own jobs, all named "Deploy: ...") can stand in for one.
#   3. Build: the two jars built from that commit with the pinned JDK (the server and its smoke test), and one SHA-256 of both, which
#      goes to the machine. The machine builds them again from the same source and puts them in place only if they're byte for byte the
#      same (deploy/remote-deploy.sh).
#   4. Deploy: waits for the owner to approve the "production" environment. Only this job may ask GitHub for an identity token
#      (id-token: write), which it trades with AWS for a role that may do one thing: run the SSM document avpx-deploy on the one
#      machine (deploy/README.md says how the owner sets that role up). It sends the commit and the jars' SHA-256, and waits for the answer.
#   A dry run (the default) does all of that but the sending, and says what it would have sent.
#
# The role, the machine and the region come from the repository's variables (not secrets: none of them gives access by itself), and
# each is held to its shape; until they're set, the deploy job refuses. No action but checkout is used: the identity token is fetched
# with curl from GitHub's own endpoint into a file only this job can read, and the AWS command line tool trades it for the role itself
# (AWS_WEB_IDENTITY_TOKEN_FILE), so no key passes through the script.
#
# THE TOOLS, and where each comes from (card #17):
#   - curl and jq are Ubuntu's own, always by their full path (/usr/bin/curl, /usr/bin/jq), so nothing earlier on PATH can stand in
#     for one; each job that uses them first runs deploy/check-ubuntu-tools.sh, which checks they're Ubuntu's and unchanged;
#   - the AWS command line tool is never the runner's: deploy/get-aws-cli.sh fetches the pinned one, checked by AWS's signature, its
#     sha256 and its version, and the job uses only that ("$aws"). Until its pins are filled in, it refuses, and so does the deploy;
#   - GitHub's own gh tool isn't used: its two questions to GitHub are asked with curl.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'The commit to put on the machine: 40 hex digits, small letters, already on main'
        required: true
        type: string
      dry_run:
        description: 'Do everything but send it, and say what would have been sent'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# One deploy at a time, and a second waits rather than cutting the first off
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  COMMIT: ${{ inputs.commit }}
  # The workflows whose latest run for the commit must have succeeded, by file, all of them (GATES.md): every one but this file
  REQUIRED: 'java.yml blockers.yml snyk.yml proofs.yml'

jobs:
  blockers:
    name: 'Deploy: blockers'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The commit's shape
        run: |
          case "$COMMIT" in *[!0-9a-f]*) echo 'the commit must be 40 hex digits, small letters'; exit 1 ;; esac
          [ "${#COMMIT}" -eq 40 ] || { echo 'the commit must be 40 hex digits, small letters'; exit 1; }
      - name: Nothing blocks a deploy
        run: sh deploy/check-blockers.sh

  gates:
    name: 'Deploy: gates'
    needs: blockers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: curl and jq are Ubuntu's own, unchanged
        run: sh deploy/check-ubuntu-tools.sh
      - name: The commit is on main, and the latest run of every required workflow for it succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Only Ubuntu's own folders, so every command here is Ubuntu's, whatever the runner put earlier on PATH
          PATH=/usr/bin:/bin
          # One question to GitHub's API, with this job's own token (which may only read): HTTPS only, and fail on any HTTP error.
          # -q first, so curl reads no ~/.curlrc.
          ask() {
            /usr/bin/curl -q --fail --silent --show-error --proto '=https' --tlsv1.2 -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/$1"
          }
          ask "compare/$COMMIT...main" > compare.json
          where=$(/usr/bin/jq -r .status compare.json)
          case "$where" in ahead|identical) echo "the commit is on main" ;; *) echo "the commit isn't on main ($where)"; exit 1 ;; esac
          ask "actions/runs?head_sha=$COMMIT&event=push&branch=main&per_page=100" > runs.json
          missing=0
          for flow in $REQUIRED; do
            ended=$(/usr/bin/jq -r --arg path ".github/workflows/$flow" --arg sha "$COMMIT" \
              '[.workflow_runs[] | select(.path == $path and .head_sha == $sha)] | sort_by(.run_number, .run_attempt) | last | .conclusion // "no run"' runs.json)
            if [ "$ended" = success ]; then echo "succeeded: $flow"; else echo "NOT SUCCEEDED: $flow ($ended)"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo 'the commit has not passed every required workflow'; exit 1; }

  build:
    name: 'Deploy: build'
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      jars: ${{ steps.hash.outputs.jars }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: The pinned JDK, checked by its signature, its sha256 and its version
        run: sh java/tools/get-jdk.sh "$RUNNER_TEMP/jdk"
      - name: Build, with every test
        run: JAVA_HOME="$RUNNER_TEMP/jdk" sh java/build.sh
      # The SHA-256 of what sha256sum prints for both jars, in the build folder: deploy/remote-deploy.sh makes it the same way
      - name: The jars' SHA-256
        id: hash
        run: |
          jars=$( (cd java/build && sha256sum avpx-server.jar avpx-smoke.jar) | sha256sum | cut -d ' ' -f 1)
          echo "the jars for $COMMIT: $jars"
          echo "jars=$jars" >> "$GITHUB_OUTPUT"

  deploy:
    name: 'Deploy: send'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      JARS: ${{ needs.build.outputs.jars }}
      ROLE: ${{ vars.AVPX_DEPLOY_ROLE_ARN }}
      MACHINE: ${{ vars.AVPX_DEPLOY_MACHINE }}
      REGION: ${{ vars.AVPX_DEPLOY_REGION }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: curl and jq are Ubuntu's own, unchanged
        run: sh deploy/check-ubuntu-tools.sh
      # A dry run fetches and checks it too, so a dry run proves the tool is there and pinned
      - name: The pinned AWS command line tool, checked by AWS's signature, its sha256 and its version
        run: sh deploy/get-aws-cli.sh "$RUNNER_TEMP/aws-cli"
      - name: The role, the machine and the region are set, each in its shape
        run: |
          printf '%s' "$JARS" | grep -Eqx '[0-9a-f]{64}' || { echo "the build gave no SHA-256 for the jars"; exit 1; }
          printf '%s' "$ROLE" | grep -Eqx 'arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]{1,64}' || { echo 'set the variable AVPX_DEPLOY_ROLE_ARN to the role (deploy/README.md)'; exit 1; }
          printf '%s' "$MACHINE" | grep -Eqx 'mi-[0-9a-f]{17}' || { echo 'set the variable AVPX_DEPLOY_MACHINE to the machine id SSM gave it, mi- and 17 hex digits'; exit 1; }
          printf '%s' "$REGION" | grep -Eqx '[a-z]{2}-[a-z]+-[0-9]' || { echo 'set the variable AVPX_DEPLOY_REGION, such as us-east-1'; exit 1; }

      - name: A dry run says what it would send, and sends nothing
        if: ${{ inputs.dry_run }}
        run: |
          echo "would run the SSM document avpx-deploy on $MACHINE in $REGION, as $ROLE, with:"
          echo "  commit=$COMMIT"
          echo "  jarsSha256=$JARS"

      - name: Send it, and wait for the machine's answer
        if: ${{ !inputs.dry_run }}
        run: |
          set -eu
          # Only Ubuntu's own folders, so every command here is Ubuntu's, whatever the runner put earlier on PATH
          PATH=/usr/bin:/bin
          # GitHub's identity token for this job, for AWS (audience sts.amazonaws.com), into a file only this job's user can read, removed
          # at the end. The aws tool trades it for the role itself, so no key ever passes through this script or its log.
          umask 077
          aws="$RUNNER_TEMP/aws-cli/bin/aws"
          token_file="$RUNNER_TEMP/aws-web-identity"
          trap 'rm -f "$token_file" "$token_file.json"' EXIT
          /usr/bin/curl -q --fail --silent --show-error --proto '=https' --tlsv1.2 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" > "$token_file.json"
          /usr/bin/jq -r .value "$token_file.json" > "$token_file"
          # It must look like the token it is (three parts of base64url, with dots between), or nothing is sent
          grep -Eqx '[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' "$token_file" || { echo 'GitHub gave no identity token'; exit 1; }
          export AWS_WEB_IDENTITY_TOKEN_FILE="$token_file" AWS_ROLE_ARN="$ROLE" AWS_ROLE_SESSION_NAME="avpx-deploy-$GITHUB_RUN_ID" AWS_REGION="$REGION"
          id=$("$aws" ssm send-command --region "$REGION" --document-name avpx-deploy --instance-ids "$MACHINE" \
            --parameters "commit=$COMMIT,jarsSha256=$JARS" --comment "AVPx deploy of $COMMIT" --query Command.CommandId --output text)
          echo "sent: command $id"
          # The machine's answer: every 15 s, for up to 40 minutes (the document itself gives up after 30)
          for i in $(seq 1 160); do
            sleep 15
            status=$("$aws" ssm get-command-invocation --region "$REGION" --command-id "$id" --instance-id "$MACHINE" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut)
                "$aws" ssm get-command-invocation --region "$REGION" --command-id "$id" --instance-id "$MACHINE" --query StandardOutputContent --output text
                echo "the machine says: $status"
                [ "$status" = Success ]
                exit $?
                ;;
            esac
          done
          echo 'no answer from the machine in 40 minutes'
          exit 1
