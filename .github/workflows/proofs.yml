# Proofs: the formal models of CRYPTO.md's handshakes, run with ProVerif, every answer checked (proofs/run.sh). Written 2026-11-09 by
# Melanikus for AVPx Dedicated Server.
#
# ProVerif is built here from INRIA's own source release, version 2.05, because Ubuntu 24.04 has no package of it (the first run said
# "Unable to locate package proverif"). Downloaded code is untrusted until it's checked (AVP Tao 1):
# - INRIA publishes no checksum and no signature for its releases, so the SHA-256 pinned below is the only check. It was taken by PO
#   on 2026-11-09 from the file at that address (980,879 bytes, last changed 2026-08-07), whose build script was read before anything
#   ran: it compiles the sources with OCaml's own tools, and fetches nothing;
# - every path in the archive must sit under proverif2.05/, with none absolute and none climbing out with "..", before it's unpacked;
# - OCaml comes from Ubuntu's archive, which apt checks against Ubuntu's signing keys;
# - it's built with -nointeract, so nothing graphical is needed.
# A new ProVerif release changes URL and KEY together, looked up the same way. Every action is pinned to a full commit hash
# (CODING-STANDARD.md rule 7).
#
# A gate never passes for want of its tool (the owner's "built to outlive us", 2026-11-09: one day INRIA's address may be gone). If
# ProVerif can't be fetched, isn't the pinned file, or won't build, this check fails, saying which. And the first job proves that
# proofs/run.sh can't pass without a real ProVerif: not with none, nor with one that stops, answers nothing, or says yes to everything.
# If the address is gone for good, any copy with the pinned SHA-256 is the same file, from wherever it comes; if ProVerif itself is
# gone, a tool that proves the same is found, reviewed as untrusted, pinned and wired in here in its place (TAKING-OVER.md, the gates),
# never skipped.
#
# THE GROUPS (2026-11-10): proofs/run.sh's groups run side by side, one job each, so a query that doesn't end yet can't hide the answers
# of the ones that do. Since round 6, a group is one variant of one query (32 of them), so each ProVerif run has a machine to itself, and
# a run that's too big for it can't take its neighbours' answers with it (round 5 lost four groups' later variants that way). Each run
# is held to 300 minutes (PROOFS_RUN_MINUTES), inside GitHub's 6 hours a job, and to 14 GiB (PROOFS_MEMORY_GIB) of the runner's 16 GB, and
# one that hasn't ended, or runs out, fails, saying which. A limit can only cost a proof, never make one. The last
# job, "Proofs (ProVerif)", is the one main requires: it passes only if the stand-ins' job and every group passed, and fails on anything
# else (a failure, a cancel, a skip). Every query of every model is in a group, so the check stays red until each one is proved. That's
# held, not just written (Primary's review, 2026-11-10): run.sh refuses unless proofs/ holds exactly its three models with exactly their
# numbers of queries, and the stand-ins' job below fails unless this file's matrix is exactly run.sh's groups. So a model, a query or a
# group added later, or a group dropped from the matrix, fails the check until it's given its place in both.
name: Proofs

on:
  pull_request:
  push:
    branches: [main]
  # So a branch can be run without a pull request. It runs the same jobs, and proves nothing more or less
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Stand-ins for ProVerif, in folders of their own, each put first on a PATH that holds no other: none at all, one that stops, one that
  # runs and answers nothing, one that says "true" to every query, and one that also says each secrecy assumption was verified.
  # proofs/run.sh must fail with each, and never say it passed. The "true" one fails at the first secrecy assumption, which it never says
  # it checked; the one that says so fails at the variants with both halves broken, whose secrecy must come out false.
  standins:
    name: "Proofs: with no ProVerif, or a broken one, they fail"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The groups job's matrix is exactly proofs/run.sh's groups, in its order, so no group is ever left out of the check
      - name: Every group of proofs/run.sh, and nothing else, is in this check's matrix
        run: |
          set -eu
          groups=$(sh proofs/run.sh --groups)
          want="        group: [$(printf '%s' "$groups" | sed 's/ /, /g')]"
          grep -qxF -- "$want" .github/workflows/proofs.yml \
            || { echo "proofs.yml's matrix isn't exactly proofs/run.sh's groups ($groups)"; exit 1; }
          echo "the matrix is proofs/run.sh's groups: $groups"
      - name: With no ProVerif, or a broken one, the proofs fail, never passing unproved
        run: |
          fake="$RUNNER_TEMP/fake-proverif"
          mkdir -p "$fake/none" "$fake/stops" "$fake/silent" "$fake/yes" "$fake/yes-verified"
          printf '#!/bin/sh\nexit 1\n' > "$fake/stops/proverif"
          printf '#!/bin/sh\nexit 0\n' > "$fake/silent/proverif"
          printf '#!/bin/sh\nn=$(grep -c "^query" "$1")\nwhile [ "$n" -gt 0 ]; do echo "RESULT a query is true."; n=$((n - 1)); done\n' > "$fake/yes/proverif"
          # The same, and before its answers a "verified" line for each "not attacker(...)" it's given, as ProVerif writes them
          cat > "$fake/yes-verified/proverif" <<'EOF'
          #!/bin/sh
          grep '^not attacker(' "$1" | sed 's/^not attacker(\(new \)\{0,1\}\([A-Za-z0-9_]*\)).*/ok, secrecy assumption verified: fact unreachable attacker(\2[])/'
          n=$(grep -c '^query' "$1")
          while [ "$n" -gt 0 ]; do echo "RESULT a query is true."; n=$((n - 1)); done
          EOF
          chmod +x "$fake/stops/proverif" "$fake/silent/proverif" "$fake/yes/proverif" "$fake/yes-verified/proverif"
          for kind in none stops silent yes yes-verified; do
            if PATH="$fake/$kind:/usr/bin:/bin" sh proofs/run.sh > "$fake/$kind.out" 2>&1; then
              cat "$fake/$kind.out"; echo "proofs/run.sh passed with the stand-in ProVerif \"$kind\""; exit 1
            fi
            if grep -q 'every answer is the one it must be' "$fake/$kind.out"; then
              cat "$fake/$kind.out"; echo "proofs/run.sh said it passed with the stand-in ProVerif \"$kind\""; exit 1
            fi
            echo "proofs/run.sh failed, as it must, with the stand-in ProVerif \"$kind\": $(tail -n 1 "$fake/$kind.out")"
          done
          # Each failed for its own reason: "yes" at the assumptions it never said it checked, and "yes-verified" (which got past them)
          # only where the answer must be false
          grep -q 'no line from ProVerif saying the secrecy assumption' "$fake/yes.out" \
            || { cat "$fake/yes.out"; echo 'the stand-in "yes" got past the secrecy assumptions it never said it checked'; exit 1; }
          if grep -q 'no line from ProVerif saying the secrecy assumption' "$fake/yes-verified.out"; then
            cat "$fake/yes-verified.out"; echo 'the stand-in "yes-verified" said it checked each assumption, and run.sh didn'"'"'t see it'; exit 1
          fi
          grep '^FAIL' "$fake/yes-verified.out" | grep -v 'must be "false' && { echo 'the stand-in "yes-verified" failed somewhere other than where an answer must be false'; exit 1; }
          echo 'each stand-in failed for its own reason'

  groups:
    name: "Proofs: ${{ matrix.group }}"
    runs-on: ubuntu-24.04
    # One run of at most 300 minutes, and the build: inside GitHub's 360 minutes a job
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        group: [pqnk-as-written, pqnk-dh-broken, pqnk-kem-broken, pqnk-both-broken, pqik-q1-as-written, pqik-q1-dh-broken, pqik-q1-kem-broken, pqik-q1-both-broken, pqik-q2-as-written, pqik-q2-dh-broken, pqik-q2-kem-broken, pqik-q2-both-broken, pqik-q3-as-written, pqik-q3-dh-broken, pqik-q3-kem-broken, pqik-q3-both-broken, pqxx-q1-as-written, pqxx-q1-dh-broken, pqxx-q1-kem-broken, pqxx-q1-both-broken, pqxx-q2-as-written, pqxx-q2-dh-broken, pqxx-q2-kem-broken, pqxx-q2-both-broken, pqxx-q3-as-written, pqxx-q3-dh-broken, pqxx-q3-kem-broken, pqxx-q3-both-broken, pqxx-q4-as-written, pqxx-q4-dh-broken, pqxx-q4-kem-broken, pqxx-q4-both-broken]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OCaml, from Ubuntu's signed archive
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ocaml-nox
          ocamlopt -version
      - name: ProVerif 2.05 from INRIA's source, checked by its pinned SHA-256, then built
        env:
          URL: https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz
          KEY: 4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4
        run: |
          set -eu
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/proverif.tar.gz" "$URL" \
            || { echo "ProVerif's source (INRIA) is unreachable: replace it with an equivalent, see TAKING-OVER.md (any copy with the SHA-256 pinned here is the same file; nothing can be proved without it, so this fails rather than passing unproved)"; exit 1; }
          echo "$KEY  $RUNNER_TEMP/proverif.tar.gz" | sha256sum --check --strict \
            || { echo "the file fetched isn't the pinned ProVerif source (its SHA-256 differs), so it's never built: this fails"; exit 1; }
          tar -tzf "$RUNNER_TEMP/proverif.tar.gz" > "$RUNNER_TEMP/proverif.list"
          if grep -v '^proverif2\.05/' "$RUNNER_TEMP/proverif.list" | grep -q .; then echo 'a path outside proverif2.05/'; exit 1; fi
          if grep -q '\.\.' "$RUNNER_TEMP/proverif.list"; then echo 'a path with ..'; exit 1; fi
          tar -xzf "$RUNNER_TEMP/proverif.tar.gz" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/proverif2.05" && sh ./build -nointeract)
          [ -x "$RUNNER_TEMP/proverif2.05/proverif" ] || { echo 'the build made no proverif'; exit 1; }
          echo "$RUNNER_TEMP/proverif2.05" >> "$GITHUB_PATH"
      - name: This group's models, variants and queries, every answer the one it must be
        env:
          GROUP: ${{ matrix.group }}
          PROOFS_RUN_MINUTES: 300
          PROOFS_MEMORY_GIB: 14
        run: |
          proverif -help 2>&1 | head -n 3 || true
          sh proofs/run.sh "$GROUP"

  # The check main requires. It looks only at the other jobs' results: "success" for both, or it fails, saying which wasn't
  all:
    name: Proofs (ProVerif)
    needs: [standins, groups]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The stand-ins' job and every group passed
        # Not "GROUPS": bash keeps that name for the user's group numbers, and ignores any value given to it
        env:
          STANDINS_RESULT: ${{ needs.standins.result }}
          GROUPS_RESULT: ${{ needs.groups.result }}
        run: |
          echo "stand-ins: $STANDINS_RESULT; groups: $GROUPS_RESULT"
          if [ "$STANDINS_RESULT" != success ] || [ "$GROUPS_RESULT" != success ]; then
            echo 'the Proofs fail: every group must pass, and every query of every model is in one (proofs/run.sh)'
            exit 1
          fi
          echo 'every model, variant and query gave the answer it must'
